<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strategy → EA · v2</title>
<style>
:root{
  --bg:#080b14; --bg2:#0b0f1c; --card:#101728; --card2:#141d33;
  --fg:#eef2ff; --muted:#94a0bd; --dim:#5b678a;
  --border:#1e2a45; --border2:#2a3a5e;
  --primary:#6ea8ff; --gold:#f6c177; --ok:#3ddc84; --warn:#ffb020; --bad:#ff5b6a; --info:#7fd1e8;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1100px 620px at 12% -8%,rgba(110,168,255,.10),transparent 60%),
    radial-gradient(900px 520px at 88% 0%,rgba(246,193,119,.08),transparent 60%),
    var(--bg);
  color:var(--fg); font-family:var(--sans); font-size:14px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1400px;margin:0 auto;padding:0 22px 80px}
code,kbd,pre{font-family:var(--mono)}

/* ── header ───────────────────────────────────────────────── */
header{
  position:sticky; top:0; z-index:40; margin:0 -22px 22px; padding:14px 22px;
  background:rgba(8,11,20,.86); backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .glyph{
  width:36px;height:36px;border-radius:11px;flex:none;
  background:linear-gradient(145deg,#6ea8ff,#f6c177);
  display:grid;place-items:center;font-size:19px;color:#08111f;
}
.brand h1{margin:0;font-size:16px;font-weight:650;letter-spacing:-.01em}
.brand p{margin:1px 0 0;font-size:11.5px;color:var(--muted)}
.v2{
  font-size:10px;font-weight:700;letter-spacing:.09em;padding:2px 7px;border-radius:999px;
  background:rgba(246,193,119,.15);color:var(--gold);border:1px solid rgba(246,193,119,.4);
  vertical-align:middle;margin-left:7px;
}
.spacer{flex:1 1 auto}
.hbtns{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{
  font:inherit;font-size:12.5px;font-weight:550;cursor:pointer;
  padding:7px 13px;border-radius:9px;border:1px solid var(--border2);
  background:var(--card);color:var(--fg);transition:.14s;
}
.btn:hover{background:var(--card2);border-color:#3a4d78}
.btn.primary{background:linear-gradient(180deg,#7cb4ff,#5c98f0);border-color:#7cb4ff;color:#06101f}
.btn.primary:hover{filter:brightness(1.08)}
.chip{
  display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;
  padding:6px 11px;border-radius:999px;border:1px solid var(--border2);background:var(--card);color:var(--muted);
}
.chip.good{border-color:rgba(61,220,132,.45);color:#8ff0b8;background:rgba(61,220,132,.09)}
.chip.warn{border-color:rgba(255,176,32,.45);color:#ffd28a;background:rgba(255,176,32,.09)}
.chip.bad{border-color:rgba(255,91,106,.5);color:#ffa9b2;background:rgba(255,91,106,.10)}

/* ── layout ───────────────────────────────────────────────── */
.cols{display:grid;grid-template-columns:288px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:960px){.cols{grid-template-columns:1fr}}
.panel{
  background:var(--card);border:1px solid var(--border);border-radius:16px;
  box-shadow:0 18px 44px rgba(0,0,0,.34);
}
.panel-h{
  padding:12px 16px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.panel-h h2{margin:0;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.panel-b{padding:14px 16px}

/* ── aspect menu ──────────────────────────────────────────── */
.menu-hint{margin:0 0 9px;font-size:11px;color:var(--dim);letter-spacing:.04em}
#menu{display:flex;flex-direction:column;gap:5px}
.mitem{
  position:relative;display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  font:inherit;font-size:13px;cursor:pointer;padding:9px 11px;border-radius:11px;
  border:1px solid transparent;background:transparent;color:var(--muted);transition:.14s;
}
.mitem:hover{background:var(--card2);color:var(--fg)}
.mitem.active{
  background:linear-gradient(90deg,rgba(110,168,255,.13),transparent);
  border-color:var(--border2);color:var(--fg);
}
.mitem.active::before{
  content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--c,#6ea8ff);
}
.m-num{
  width:22px;height:22px;flex:none;border-radius:7px;display:grid;place-items:center;
  font-size:11px;font-weight:700;background:var(--card2);color:var(--c,#6ea8ff);border:1px solid var(--border);
}
.m-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-chip{
  font-size:10px;font-weight:700;padding:1px 7px;border-radius:999px;flex:none;
  background:var(--card2);color:var(--dim);border:1px solid var(--border);
}
.m-chip.ok{color:#8ff0b8;border-color:rgba(61,220,132,.35);background:rgba(61,220,132,.08)}
.m-chip.part{color:#ffd28a;border-color:rgba(255,176,32,.35);background:rgba(255,176,32,.08)}
.m-chip.na{color:var(--dim);opacity:.75}
.m-dot{width:5px;height:5px;border-radius:50%;background:var(--gold);flex:none}

/* ── detail ───────────────────────────────────────────────── */
.d-head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.d-num{
  width:32px;height:32px;border-radius:10px;flex:none;display:grid;place-items:center;
  font-size:14px;font-weight:700;background:color-mix(in srgb,var(--c) 16%,transparent);
  color:var(--c);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);
}
.d-head h2{margin:0;font-size:19px;font-weight:650;letter-spacing:-.015em;text-wrap:balance}
.d-q{margin:2px 0 0;color:var(--fg);font-size:13.5px}
.d-tip{
  margin:12px 0 0;padding:11px 13px;border-radius:11px;font-size:12.5px;color:var(--muted);
  background:rgba(110,168,255,.06);border-left:2px solid rgba(110,168,255,.5);text-wrap:pretty;
}
.d-fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:16px}

/* ── one field ────────────────────────────────────────────── */
.field{
  border:1px solid var(--border);border-radius:13px;padding:12px 13px;background:var(--card2);
  transition:.15s;
}
.field.off{opacity:.52;background:transparent;border-style:dashed}
.f-head{display:flex;align-items:center;gap:8px;justify-content:space-between}
.f-label{font-size:12.5px;font-weight:600}
.f-na{
  font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--dim);border:1px solid var(--border);border-radius:999px;padding:1px 6px;flex:none;
}
.f-hint{font-size:11px;color:var(--dim);margin-top:3px;text-wrap:pretty}
.f-reason{
  font-size:11px;color:#ffcf9a;margin-top:6px;padding:6px 8px;border-radius:8px;
  background:rgba(255,176,32,.07);border-left:2px solid rgba(255,176,32,.45);
}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.opt{
  position:relative;font:inherit;font-size:11.5px;cursor:pointer;padding:6px 10px;border-radius:9px;
  border:1px solid var(--border2);background:var(--card);color:var(--muted);transition:.13s;
  display:flex;flex-direction:column;gap:1px;text-align:left;max-width:100%;
}
.opt:hover:not(.blocked){color:var(--fg);border-color:#44598a}
.opt.sel{
  background:rgba(246,193,119,.14);border-color:var(--gold);color:var(--gold);font-weight:600;
}
.opt.blocked{
  opacity:.42;cursor:not-allowed;border-style:dashed;text-decoration:line-through;
  text-decoration-color:rgba(255,91,106,.5);text-decoration-thickness:1px;
}
.opt-why{font-size:10px;color:#ffb0b8;text-decoration:none;max-width:210px;text-wrap:pretty}
.row{display:flex;align-items:center;gap:10px;margin-top:9px}
input[type=range]{flex:1;min-width:0;accent-color:var(--gold);height:18px}
input[type=text]{
  flex:1;min-width:0;font:inherit;font-size:12px;padding:6px 9px;border-radius:8px;
  border:1px solid var(--border2);background:var(--bg2);color:var(--fg);
}
input:disabled{opacity:.5;cursor:not-allowed}
.ro{
  font-family:var(--mono);font-size:11.5px;color:var(--gold);min-width:54px;text-align:right;flex:none;
}
.seg{display:flex;gap:5px;margin-top:9px}
.seg-b{
  font:inherit;font-size:11.5px;cursor:pointer;padding:6px 11px;border-radius:8px;
  border:1px solid var(--border2);background:var(--card);color:var(--muted);transition:.13s;
}
.seg-b:hover:not(:disabled){color:var(--fg)}
.seg-b.on{background:rgba(110,168,255,.16);border-color:var(--primary);color:var(--primary);font-weight:600}
.seg-b:disabled{opacity:.45;cursor:not-allowed}
.f-foot{margin-top:10px;padding-top:8px;border-top:1px solid var(--border)}
.lands{display:flex;gap:4px;flex-wrap:wrap}
.land{
  font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:1.5px 6px;border-radius:5px;border:1px solid var(--border);color:var(--dim);
}
.land.spec{color:#8fb6ff;border-color:rgba(110,168,255,.35)}
.land.logic{color:#8ff0b8;border-color:rgba(61,220,132,.35)}
.land.doc{color:#ffd28a;border-color:rgba(255,176,32,.35)}

/* ── settings groups ──────────────────────────────────────── */
.is-group{border-bottom:1px solid var(--border)}
.is-group:last-child{border-bottom:0}
.is-title{
  display:flex;align-items:center;gap:9px;padding:11px 16px;font-size:12px;font-weight:650;
  background:var(--bg2);position:sticky;top:66px;z-index:5;
}
.is-num{
  width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:10.5px;font-weight:700;
  background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);
  border:1px solid color-mix(in srgb,var(--c) 45%,transparent);flex:none;
}
.is-na{font-size:10px;color:var(--dim);font-weight:600;margin-left:auto}
.is-body{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:12px;padding:14px 16px}

/* ── report ───────────────────────────────────────────────── */
.rep-card{border:1px solid var(--border);border-radius:13px;padding:12px 14px;margin-bottom:11px;background:var(--card2)}
.rep-card.ok{border-color:rgba(61,220,132,.3);background:rgba(61,220,132,.05)}
.rep-card.warn{border-color:rgba(255,176,32,.35);background:rgba(255,176,32,.06)}
.rep-card.caution{border-color:rgba(255,176,32,.35);background:rgba(255,176,32,.06)}
.rep-card.info{border-color:var(--border2)}
.rep-h{font-size:12.5px;font-weight:650}
.rep-sub{font-size:11.5px;color:var(--muted);margin-top:3px}
.rep-list{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.rep-list li{font-size:11.5px;color:var(--muted);line-height:1.5;text-wrap:pretty}
.rep-list code{font-size:11px;color:var(--fg);background:var(--bg2);padding:1px 5px;border-radius:5px;border:1px solid var(--border)}
.rep-why{display:block;color:var(--dim);font-size:11px;margin-top:1px}
.rep-more{color:var(--dim);font-style:italic}
.mini{
  font:inherit;font-size:10.5px;font-weight:600;cursor:pointer;margin-left:6px;
  padding:2px 8px;border-radius:6px;border:1px solid rgba(255,176,32,.5);
  background:rgba(255,176,32,.12);color:#ffd28a;
}
.mini:hover{background:rgba(255,176,32,.22)}

/* ── coverage ─────────────────────────────────────────────── */
.coverage{border:1px solid var(--border);border-radius:13px;padding:12px 14px;background:var(--card2)}
.coverage.ok{border-color:rgba(61,220,132,.32)}
.coverage.bad{border-color:rgba(255,91,106,.45)}
.cov-row{display:flex;align-items:baseline;gap:9px;font-size:11.5px;padding:4px 0;flex-wrap:wrap}
.cov-row.bad .cov-name{color:#ffa9b2}
.cov-name{font-weight:650;min-width:62px}
.cov-n{font-family:var(--mono);color:var(--ok);font-size:11px}
.cov-row.bad .cov-n{color:var(--bad)}
.cov-ok{color:var(--dim);font-size:11px}
.cov-miss{color:#ffa9b2;font-size:11px}
.cov-note{margin-top:8px;padding-top:8px;border-top:1px solid var(--border);font-size:11px;color:var(--muted)}

/* ── output ───────────────────────────────────────────────── */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{
  font:inherit;font-size:12px;font-weight:600;cursor:pointer;padding:7px 13px;border-radius:9px;
  border:1px solid var(--border2);background:var(--card);color:var(--muted);transition:.13s;
}
.tab:hover{color:var(--fg)}
.tab.active{background:rgba(246,193,119,.14);border-color:var(--gold);color:var(--gold)}
pre#output{
  margin:0;padding:16px;max-height:620px;overflow:auto;font-size:11.5px;line-height:1.6;
  background:var(--bg2);border-radius:0 0 15px 15px;white-space:pre;color:#cdd8f5;
  border-top:1px solid var(--border);
}
pre#output::-webkit-scrollbar{width:10px;height:10px}
pre#output::-webkit-scrollbar-thumb{background:var(--border2);border-radius:6px}
.out-meta{font-size:11px;color:var(--dim);font-family:var(--mono)}

/* ── toast ────────────────────────────────────────────────── */
#toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,18px);opacity:0;pointer-events:none;
  background:var(--card2);border:1px solid var(--border2);color:var(--fg);font-size:12.5px;
  padding:10px 16px;border-radius:11px;box-shadow:0 14px 34px rgba(0,0,0,.5);transition:.2s;z-index:90;
}
#toast.show{opacity:1;transform:translate(-50%,0)}
.spin{display:inline-block;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ok-t{color:#8ff0b8;font-weight:600}
.bad-t{color:#ffa9b2;font-weight:600}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <div class="glyph">⢕</div>
      <div>
        <h1>Strategy → EA<span class="v2">V2</span></h1>
        <p>10 aspects · contradictions blocked · every selection compiled into all three outputs</p>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="hbtns">
      <span class="chip" id="cov-chip">coverage —</span>
      <button class="btn" id="verify">Verify all combinations</button>
      <button class="btn" id="reset">Reset</button>
    </div>
  </header>

  <div class="cols">
    <aside class="panel">
      <div class="panel-b">
        <p class="menu-hint">10 aspects · click to expand</p>
        <nav id="menu"></nav>
      </div>
    </aside>
    <main class="panel">
      <div class="panel-b">
        <div id="detail"></div>
      </div>
    </main>
  </div>

  <div class="cols" style="margin-top:20px;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)">
    <section class="panel">
      <div class="panel-h">
        <h2>Aspect settings</h2>
        <span class="spacer"></span>
        <span class="out-meta">dashed = not applicable to the current selection</span>
      </div>
      <div id="inputs"></div>
    </section>
    <section class="panel">
      <div class="panel-h"><h2>Consistency check</h2></div>
      <div class="panel-b">
        <div id="report"></div>
      </div>
    </section>
  </div>

  <section class="panel" style="margin-top:20px">
    <div class="panel-h">
      <h2>Generate</h2>
      <div class="tabs" style="margin-left:4px">
        <button class="tab active" data-tab="spec">Technical Spec</button>
        <button class="tab" data-tab="mql">MQL5 Expert Advisor</button>
        <button class="tab" data-tab="pine">Pine Script v6</button>
      </div>
      <span class="spacer"></span>
      <span class="out-meta" id="linecount">—</span>
      <button class="btn" id="copy">Copy</button>
      <button class="btn primary" id="download">Download</button>
    </div>
    <div class="panel-b" style="border-bottom:1px solid var(--border)">
      <div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap">
        <strong id="out-title" style="font-size:13.5px">Technical Spec</strong>
        <span class="out-meta" id="out-sub"></span>
      </div>
    </div>
    <pre id="output"></pre>
    <div class="panel-b" style="border-top:1px solid var(--border)">
      <div id="coverage" class="coverage"></div>
      <div id="verify-out" style="margin-top:10px;font-size:11.5px;color:var(--muted)"></div>
    </div>
  </section>

</div>
<div id="toast"></div>

<script src="/app/model.js"></script>
<script src="/app/engine.js"></script>
<script src="/app/gen-spec.js"></script>
<script src="/app/gen-mql.js"></script>
<script src="/app/gen-pine.js"></script>
<script src="/app/ui.js"></script>
</body>
</html>
